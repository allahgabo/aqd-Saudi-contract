# ─────────────────────────────────────────────────────────────────────────
# render.yaml — Infrastructure as Code for Render.com
# ─────────────────────────────────────────────────────────────────────────

databases:
  - name: aqd-db
    databaseName: aqd_db
    user: aqd_user
    plan: free          # free PostgreSQL (expires after 90 days on free tier)

services:

  # ── Django REST API ─────────────────────────────────────────────────
  - type: web
    name: aqd-backend
    runtime: python
    rootDir: backend
    # No "plan:" here — defaults to Render's free Individual tier
    buildCommand: "./build.sh"
    startCommand: "gunicorn aqd_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --log-level info"
    healthCheckPath: /api/health/

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqd-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: OPENAI_API_KEY
        sync: false            # ⚠ Set manually in Render dashboard

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.11.0"

      # Uncomment and set AFTER frontend deploys:
      # - key: FRONTEND_URL
      #   value: https://aqd-frontend.onrender.com


  # ── React Static Site ───────────────────────────────────────────────
  - type: web
    name: aqd-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.html
        name: Cache-Control
        value: "no-cache"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: REACT_APP_API_URL
        sync: false            # ⚠ Set to https://aqd-backend.onrender.com/api
