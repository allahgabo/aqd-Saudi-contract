# ─────────────────────────────────────────────────────────────────────────
# render.yaml — Infrastructure as Code for Render.com
# Deploy both backend API and frontend static site from one file
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────

databases:
  - name: aqd-db
    databaseName: aqd_db
    user: aqd_user
    plan: free        # upgrade to starter ($7/mo) for production persistence

services:

  # ── Django REST API ─────────────────────────────────────────────────
  - type: web
    name: aqd-backend
    runtime: python
    rootDir: backend
    plan: free          # upgrade to starter ($7/mo) for always-on
    buildCommand: "./build.sh"
    startCommand: "gunicorn aqd_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --log-level info"
    healthCheckPath: /api/health/

    envVars:
      # ── Pulled from Render's database (auto-linked) ──────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: aqd-db
          property: connectionString

      # ── Secrets (set these manually in Render dashboard) ─────────────
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure key

      - key: OPENAI_API_KEY
        sync: false                  # ⚠ Set manually in Render dashboard

      # ── App settings ─────────────────────────────────────────────────
      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.11.0"

      # ── Frontend origin (CORS) — set after frontend deploys ──────────
      # - key: FRONTEND_URL
      #   value: https://aqd-frontend.onrender.com


  # ── React Static Site ───────────────────────────────────────────────
  - type: web
    name: aqd-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false

    headers:
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Cache static assets aggressively, but not HTML
      - path: /static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.html
        name: Cache-Control
        value: "no-cache"

    routes:
      # Single Page Application — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # ⚠ Set this to your aqd-backend URL after it deploys
      # e.g. https://aqd-backend.onrender.com/api
      - key: REACT_APP_API_URL
        sync: false
